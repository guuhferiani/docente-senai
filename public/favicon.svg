<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="senaiRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea1d2c"/>
      <stop offset="100%" stop-color="#b8000b"/>
    </linearGradient>
  </defs>
  <!-- Background Badge (SENAI Red Squircle) -->
  <rect width="64" height="64" rx="16" fill="url(#senaiRed)"/>
  <!-- Subtle border for high contrast in dark/light browser tabs -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
  <!-- Bold "S" Initial -->
  <text x="32" y="33" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-size="40" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="central">S</text>
</svg>
